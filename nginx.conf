server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com https://lh3.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://us-central1-gen-lang-client-0861985618.cloudfunctions.net https://checkout.stripe.com https://api.flutterwave.com; frame-src https://checkout.stripe.com https://js.stripe.com; object-src 'none'; base-uri 'self';" always;
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~ /\. { deny all; return 404; }

    location / { try_files $uri $uri/ /index.html; }
}
