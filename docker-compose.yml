version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY:             ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN:         ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID:          ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET:      ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID:              ${VITE_FIREBASE_APP_ID}
        VITE_USE_EMULATORS:                "true"
    ports:
      - "8080:80"
    depends_on:
      firebase-emulators:
        condition: service_healthy
    networks: [ygpt]

  firebase-emulators:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - emulator-data:/app/.firebase/emulator-data
    command: >
      sh -c "npm install -g firebase-tools &&
             cd functions && npm ci && cd .. &&
             firebase emulators:start
               --import=.firebase/emulator-data
               --export-on-exit=.firebase/emulator-data
               --project demo-yorubagpt"
    ports:
      - "9099:9099"
      - "8081:8080"
      - "5001:5001"
      - "4000:4000"
    healthcheck:
      test: ["CMD","wget","--quiet","--spider","http://localhost:4000"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 30s
    networks: [ygpt]

volumes:
  emulator-data:

networks:
  ygpt:
    driver: bridge
